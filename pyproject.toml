[project]
name = "retroread"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "easyocr>=1.7.2",
    "fastapi>=0.141.1",
    "mlflow>=3.15.1",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pycocotools>=2.0.11",
    "python-multipart>=0.0.32",
    "streamlit>=1.63.0",
    "streamlit-image-coordinates>=0.4.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.138",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]
